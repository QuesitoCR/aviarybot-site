<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AviaryBOT — Comandos</title>

<style>
:root{
  --bg0:#0b0d12;
  --bg1:#1c1f26;
  --card:rgba(255,255,255,.04);
  --card2:rgba(255,255,255,.06);
  --text:#eaeaf0;
  --muted:#cfcfe6;
  --sub:#9aa0ff;
  --line:rgba(255,255,255,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,sans-serif;
}

body{
  background:radial-gradient(circle at top,var(--bg1),var(--bg0));
  color:var(--text);
  padding:24px;
}

.wrap{
  max-width:900px;
  margin:auto;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px;
}

h1{
  margin-bottom:6px;
}

h2{
  margin-top:28px;
  margin-bottom:8px;
}

.section{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-top:10px;
  line-height:1.55;
}

code{
  background:#0006;
  padding:2px 6px;
  border-radius:6px;
  overflow-wrap:anywhere;
}

/* Lista de comandos (se genera sola desde los datos del bot) */
.legend{
  color:#a0a0c0;
  font-size:.9rem;
  margin-top:6px;
}

.cat-desc{
  color:var(--muted);
  opacity:.8;
  font-size:.95rem;
}

.cmd + .cmd{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}

.cmd-desc{
  color:var(--muted);
  margin-top:4px;
}

.badge{
  display:inline-block;
  margin-left:6px;
  padding:1px 8px;
  border-radius:999px;
  font-size:.78rem;
  vertical-align:middle;
  border:1px solid var(--line);
}

.badge-admin{
  background:rgba(255,120,120,.12);
  color:#ffb4b4;
}

.badge-mod{
  background:rgba(154,160,255,.14);
  color:#c3c6ff;
}

@media (max-width:600px){
  body{ padding:16px; }
  .card{ padding:20px 16px; }
}

a{
  color:var(--sub);
  text-decoration:none;
}

.nav{
  margin-bottom:18px;
}

.nav a{
  margin-right:12px;
}

/* Footer unificado */
.footer{
  margin-top:18px;
  text-align:center;
  color:#a0a0c0;
  font-size:.95rem;
  line-height:1.45;
}

.footer .kaomoji{
  margin-top:10px;
  opacity:.75;
}

.footer .copyright{
  opacity:.5;
  margin-top:16px;
  font-size:.85rem;
}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<div class="nav">
<a href="./index.html">Inicio</a>
<a href="./terms.html">Términos</a>
<a href="./privacy.html">Privacidad</a>
<a href="https://unstudiomax.carrd.co/" target="_blank" rel="noopener noreferrer">Contacto</a>
</div>

<h1>AviaryBOT — Lista de comandos</h1>
<p>Versión actual: <strong class="bot-version"></strong></p>
<p class="legend"><code>&lt;dato&gt;</code> obligatorio · <code>[dato]</code> opcional · la lista se actualiza sola con cada versión del bot</p>

<!-- La lista de comandos la genera commands.js con los datos que publica el bot -->
<div id="commands-list">
  <div class="section">Cargando comandos…</div>
</div>

<div class="footer">
  Creado por xMax • ~unstudiomax~<br />
  <span style="opacity:.85">Última actualización: <span class="bot-update"></span></span>
  <div class="kaomoji">(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</div>
  <div class="copyright">© 2026 xMax — AviaryBOT</div>
</div>

</div>
</div>

<!-- Carga versión, fecha y comandos desde los datos que publica el bot -->
<script src="./version.js"></script>
<script src="./commands.js"></script>

</body>
</html>
